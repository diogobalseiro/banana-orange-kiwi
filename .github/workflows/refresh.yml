name: Refresh Cat Food Catalog

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Category to refresh'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - wet
          - dry

concurrency:
  group: "catalog-refresh"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 certifi

      - name: Run Catalog Scraper & Site Rebuilder
        run: |
          python refresh.py --retailer continente --type ${{ github.event.inputs.category || 'all' }}

      - name: Commit & Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh cat food catalog data" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
