name: Scheduled Cat Food Catalog Refresh

on:
  schedule:
    # Trigger weekly on Mondays at 05:00 UTC; the step checks for even ISO weeks to run every 2 weeks
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check Bi-Weekly Schedule
        id: schedule_check
        run: |
          WEEK_NUM=$(date +%-V)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected. Running workflow."
            echo "run=true" >> $GITHUB_OUTPUT
          elif [ $(( 10#$WEEK_NUM % 2 )) -eq 0 ]; then
            echo "Running bi-weekly refresh on even ISO week $WEEK_NUM."
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping: bi-weekly schedule runs on even ISO weeks (current week: $WEEK_NUM)."
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.schedule_check.outputs.run == 'true'
        run: |
          pip install beautifulsoup4

      - name: Run Catalog Scraper & Site Rebuilder
        if: steps.schedule_check.outputs.run == 'true'
        run: |
          python refresh.py --retailer continente --type all

      - name: Commit & Push Updated Data
        if: steps.schedule_check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): bi-weekly cat food catalog refresh" && git push)
